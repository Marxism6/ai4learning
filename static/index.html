<!DOCTYPE html>
<html lang="en" data-theme="eye-protection">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numerical Analysis Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@460;540;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- NAV BAR -->
  <nav class="nav-bar" id="navBar">
    <div class="nav-brand">NUMERICAL ANALYSIS TUTOR</div>
    <div class="nav-tabs" id="navTabs">
      <button class="nav-tab nav-tab-active" data-block="">CHAT</button>
    </div>
    <div class="nav-controls">
      <button class="mode-toggle" id="modeToggle" title="Toggle color mode">
        <span class="mode-option active">EYE</span>
        <span class="mode-option">STD</span>
      </button>
    </div>
  </nav>

  <!-- CHAT AREA -->
  <main class="chat-area" id="chatArea">
    <div class="conversation" id="conversation">
      <!-- Welcome message (updated dynamically by chat.js) -->
      <div class="message agent-message" data-message="welcome">
        <div class="message-content">
          <p>Welcome to the Numerical Analysis Tutor. I'm here to help you master numerical methods through guided Socratic dialogue.</p>
          <p>Select a topic from the navigation bar above, or just start typing your question below.</p>
        </div>
      </div>
    </div>

    <!-- Scroll anchor -->
    <div id="scrollAnchor"></div>
  </main>

  <!-- INPUT BAR -->
  <div class="input-bar-wrapper">
    <div class="input-bar" id="inputBar">
      <input
        type="text"
        class="input-field"
        id="inputField"
        placeholder="Type your answer or question..."
        autofocus
      >
      <button class="btn-send" id="sendButton" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
